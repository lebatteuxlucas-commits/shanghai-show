<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revue des catalogues — FutureMotion (local)</title>
<style>
  /* Mêmes jetons que l'annuaire, en local uniquement. */
  :root {
    --charcoal:#1F2A35; --dark:#2A3742; --mid:#5A6770; --bg:#F4F6F8; --white:#fff;
    --teal:#1FA876; --teal-dark:#16835B; --teal-light:#E4F5ED; --border:#E1E5E8;
    --mono:'SF Mono',Menlo,'Courier New',monospace;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; font-size:14px; color:var(--charcoal); background:var(--bg); height:100vh; display:flex; flex-direction:column; }
  header { background:var(--dark); color:#fff; padding:10px 18px; display:flex; align-items:center; gap:18px; flex-wrap:wrap; }
  header h1 { font-size:15px; font-weight:600; }
  .counts { font-family:var(--mono); font-size:12px; color:rgba(255,255,255,.75); display:flex; gap:14px; flex-wrap:wrap; }
  .counts b { color:#fff; }
  header input { margin-left:auto; padding:6px 10px; border:1px solid rgba(255,255,255,.2); border-radius:4px; background:rgba(255,255,255,.08); color:#fff; font:inherit; width:190px; }
  header input::placeholder { color:rgba(255,255,255,.5); }
  main { flex:1; display:flex; min-height:0; }
  .list { width:290px; border-right:1px solid var(--border); background:var(--white); overflow-y:auto; }
  .list-item { padding:8px 12px; border-bottom:1px solid var(--bg); cursor:pointer; font-size:12px; line-height:1.35; }
  .list-item:hover { background:var(--teal-light); }
  .list-item.active { background:var(--teal-light); box-shadow:inset 3px 0 0 var(--teal); }
  .list-item .k { font-weight:600; }
  .list-item .f { color:var(--mid); overflow-wrap:anywhere; }
  .tag { float:right; font-family:var(--mono); font-size:10px; padding:1px 5px; border-radius:3px; }
  .tag.link { background:var(--teal-light); color:var(--teal-dark); }
  .tag.add { background:#fff7e0; color:#8a6d00; }
  .tag.skip { background:#f1f2f4; color:var(--mid); }
  .panel { flex:1; display:flex; min-width:0; }
  .info { width:400px; padding:16px; overflow-y:auto; border-right:1px solid var(--border); background:var(--white); }
  .preview { flex:1; background:#333; min-width:0; }
  .preview iframe { width:100%; height:100%; border:0; }
  h2 { font-size:16px; margin-bottom:4px; overflow-wrap:anywhere; }
  .meta { font-family:var(--mono); font-size:11px; color:var(--mid); margin-bottom:12px; overflow-wrap:anywhere; }
  .block { border:1px solid var(--border); border-radius:6px; padding:10px 12px; margin-bottom:12px; }
  .block h3 { font-size:11px; text-transform:uppercase; letter-spacing:.8px; color:var(--mid); margin-bottom:6px; }
  .pdfinfo { font-size:12px; line-height:1.5; overflow-wrap:anywhere; }
  input[type=text], input[type=search], select, textarea { width:100%; padding:7px 9px; border:1.5px solid var(--border); border-radius:5px; font:inherit; font-size:13px; background:var(--bg); }
  input:focus, select:focus, textarea:focus { outline:none; border-color:var(--teal); background:var(--white); }
  .row { display:flex; gap:8px; }
  .row > * { flex:1; }
  label { display:block; font-size:11px; color:var(--mid); margin:8px 0 3px; }
  .results { max-height:220px; overflow-y:auto; margin-top:6px; }
  .sup { padding:6px 8px; border-radius:4px; cursor:pointer; font-size:12px; line-height:1.35; }
  .sup:hover { background:var(--teal-light); }
  .sup b { color:var(--teal-dark); }
  .sup .s { color:var(--mid); font-family:var(--mono); font-size:11px; }
  button { font:inherit; font-size:13px; font-weight:600; border:none; border-radius:5px; padding:9px 12px; cursor:pointer; }
  .b-link { background:var(--teal); color:#fff; width:100%; }
  .b-add { background:#8a6d00; color:#fff; width:100%; }
  .b-skip { background:var(--white); color:var(--mid); border:1px solid var(--border); flex:1; }
  .b-next { background:var(--dark); color:#fff; flex:1; }
  .actions { display:flex; gap:8px; margin-top:8px; }
  .err { color:#B42318; font-size:12px; margin-top:6px; }
  .done { background:var(--teal-light); border:1px solid var(--teal); border-radius:6px; padding:10px 12px; font-size:12px; margin-bottom:12px; }
</style>
</head>
<body>
<header>
  <h1>Revue des catalogues sans correspondance</h1>
  <div class="counts" id="counts"></div>
  <input id="who" type="text" placeholder="Votre prénom (decided_by)">
</header>
<main>
  <div class="list" id="list"></div>
  <div class="panel">
    <div class="info" id="info"></div>
    <div class="preview"><iframe id="preview" title="Aperçu du catalogue"></iframe></div>
  </div>
</main>

<script>
let ITEMS = [], SUPPLIERS = [], HALLS = [], DECISIONS = new Map(), cur = 0;
const key = (it) => it.category_folder + '/' + it.filename;
const esc = (s) => (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

async function load() {
  const d = await (await fetch('/api/data')).json();
  ITEMS = d.items; SUPPLIERS = d.suppliers; HALLS = d.halls;
  DECISIONS = new Map(d.decisions.map(x => [x.category_folder + '/' + x.filename, x]));
  document.getElementById('who').value = localStorage.getItem('review_who') || '';
  cur = Math.max(0, ITEMS.findIndex(it => !DECISIONS.has(key(it))));
  render();
}

function render() {
  renderCounts(); renderList(); renderItem();
}

function renderCounts() {
  const by = { link: 0, add: 0, skip: 0 };
  for (const d of DECISIONS.values()) if (by[d.decision] !== undefined) by[d.decision]++;
  const done = DECISIONS.size;
  document.getElementById('counts').innerHTML =
    `<span><b>${done}</b> décidés · <b>${ITEMS.length - done}</b> restants</span>` +
    `<span>rattachés <b>${by.link}</b></span><span>ajoutés <b>${by.add}</b></span><span>écartés <b>${by.skip}</b></span>`;
}

function renderList() {
  document.getElementById('list').innerHTML = ITEMS.map((it, i) => {
    const d = DECISIONS.get(key(it));
    const tag = d ? `<span class="tag ${d.decision}">${d.decision}</span>` : '';
    return `<div class="list-item${i === cur ? ' active' : ''}" onclick="go(${i})">${tag}
      <div class="k">${esc(it.cle || it.filename)}</div>
      <div class="f">${esc(it.filename)}</div></div>`;
  }).join('');
  const el = document.querySelector('.list-item.active');
  if (el) el.scrollIntoView({ block: 'nearest' });
}

function renderItem() {
  const it = ITEMS[cur];
  const info = document.getElementById('info');
  if (!it) { info.innerHTML = '<div class="done">Tout est décidé 🎉</div>'; document.getElementById('preview').src = 'about:blank'; return; }
  const d = DECISIONS.get(key(it));
  const fileUrl = '/api/file?f=' + encodeURIComponent(it.category_folder + '/' + it.filename);
  document.getElementById('preview').src = it.filename.toLowerCase().endsWith('.pdf') ? fileUrl : 'about:blank';
  info.innerHTML = `
    ${d ? `<div class="done">Déjà décidé : <b>${esc(d.decision)}</b>${d.existing_id ? ' → ' + esc(d.existing_id) : ''}${d.new_en ? ' → ' + esc(d.new_en) : ''}${d.note ? ' · ' + esc(d.note) : ''}<br>Choisir à nouveau remplace la décision.</div>` : ''}
    <h2>${esc(it.cle || it.filename)}</h2>
    <div class="meta">${esc(it.filename)}<br>${esc(it.category_folder)} · statut ${esc(it.statut)}
      · <a href="${fileUrl}" target="_blank">Open file</a></div>

    ${(it.pdf_names || it.pdf_sites) ? `<div class="block"><h3>Lu dans le PDF</h3>
      <div class="pdfinfo">${esc(it.pdf_names) || '—'}${it.pdf_sites ? '<br><span class="s">' + esc(it.pdf_sites) + '</span>' : ''}</div></div>` : ''}

    <div class="block">
      <h3>Rattacher à un exposant</h3>
      ${it.candidates.length ? '<div class="pdfinfo">Candidats proposés :</div>' + it.candidates.map(c =>
        `<div class="sup" onclick="pick('${c.id}')"><b>${esc(c.id)}</b> ${esc(c.label)}</div>`).join('') : ''}
      <label for="q">Rechercher (nom, chinois, marque, stand)</label>
      <input id="q" type="search" oninput="search(this.value)" placeholder="ex. ROCKBROS, 宁波, W4-1542">
      <div class="results" id="results"></div>
      <input id="linkId" type="text" placeholder="id de l'exposant" style="margin-top:6px">
      <button class="b-link" style="margin-top:6px" onclick="decide('link')">Link to existing exhibitor</button>
    </div>

    <div class="block">
      <h3>Ajouter comme nouvel exposant (présent au salon)</h3>
      <label>Nom anglais *</label><input id="new_en" type="text" value="${esc(it.cle || '')}">
      <div class="row"><div><label>Marque *</label><input id="new_brand" type="text" value="${esc(it.cle || '')}"></div>
        <div><label>Hall *</label><select id="new_hall"><option value="">—</option>${HALLS.map(h => `<option value="${h.code}">${h.code} · ${esc(h.en)}</option>`).join('')}</select></div></div>
      <div class="row"><div><label>Stand (si connu)</label><input id="new_booth" type="text" placeholder="W4-1542"></div>
        <div><label>Nom chinois</label><input id="new_cn" type="text"></div></div>
      <label>Site web</label><input id="new_website" type="text" placeholder="exemple.com">
      <button class="b-add" style="margin-top:8px" onclick="decide('add')">Add as new exhibitor — was at the show</button>
    </div>

    <div class="block">
      <h3>Écarter</h3>
      <input id="note" type="text" placeholder="raison courte (pas un exposant, reçu sur WeChat…)">
      <div class="actions">
        <button class="b-skip" onclick="decide('skip')">Not an exhibitor / skip</button>
        <button class="b-next" onclick="decide('undecided')">Undecided →</button>
      </div>
    </div>
    <div class="err" id="err"></div>`;
  search('');
}

function search(q) {
  q = (q || '').trim().toLowerCase();
  const out = document.getElementById('results');
  if (!q) { out.innerHTML = ''; return; }
  const hits = SUPPLIERS.filter(s =>
    s.en.toLowerCase().includes(q) || s.cn.includes(q) || s.brand.toLowerCase().includes(q) || s.booth.toLowerCase().includes(q)
  ).slice(0, 40);
  out.innerHTML = hits.map(s => `<div class="sup" onclick="pick('${s.id}')">
    <b>${esc(s.brand || '—')}</b> ${esc(s.en)}<br>
    <span class="s">${esc(s.id)} · ${esc(s.hall)} ${esc(s.booth)}${s.cn ? ' · ' + esc(s.cn) : ''}${s.files ? ' · ' + s.files + ' fichier(s)' : ''}</span></div>`).join('')
    || '<div class="pdfinfo">Aucun résultat.</div>';
}

function pick(id) { document.getElementById('linkId').value = id; }
function go(i) { cur = i; render(); }

async function decide(decision) {
  const it = ITEMS[cur];
  const who = document.getElementById('who').value.trim();
  localStorage.setItem('review_who', who);
  const val = (id) => (document.getElementById(id)?.value || '').trim();
  const body = {
    filename: it.filename, category_folder: it.category_folder, decision,
    existing_id: decision === 'link' ? val('linkId') : '',
    new_en: decision === 'add' ? val('new_en') : '', new_cn: decision === 'add' ? val('new_cn') : '',
    new_brand: decision === 'add' ? val('new_brand') : '', new_hall: decision === 'add' ? val('new_hall') : '',
    new_booth: decision === 'add' ? val('new_booth') : '', new_website: decision === 'add' ? val('new_website') : '',
    note: val('note'), decided_by: who,
  };
  if (decision === 'link' && !body.existing_id) { document.getElementById('err').textContent = 'Choisir un exposant.'; return; }
  const res = await fetch('/api/decision', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const out = await res.json();
  if (!res.ok) { document.getElementById('err').textContent = out.error || 'Erreur'; return; }
  if (decision === 'undecided') DECISIONS.delete(key(it));
  else DECISIONS.set(key(it), { ...body, decided_at: new Date().toISOString() });
  // Passer au suivant non décidé, sinon simplement au suivant.
  const nextUndecided = ITEMS.findIndex((x, i) => i > cur && !DECISIONS.has(key(x)));
  cur = nextUndecided >= 0 ? nextUndecided : Math.min(cur + 1, ITEMS.length);
  render();
}

load();
</script>
</body>
</html>
